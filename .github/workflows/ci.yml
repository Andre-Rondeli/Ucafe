# Testes em todo push e PR; deploy da Edge Function em todo push no `main`.
#
# Por que existe: o front sobe sozinho pela Vercel, mas publicar Edge Function seria um
# passo MANUAL na máquina de alguém. Num projeto irmão isso custou caro duas vezes: uma
# função publicada sem as migrations de que dependia, e um merge que subiu a tela nova
# falando de um comportamento que a função em produção ainda não tinha. Passo manual em
# fluxo de deploy não é disciplina, é bug esperando data.
#
# O deploy é gated pelos testes de propósito: os testes de contrato da própria função
# (`supabase/functions/*/contrato.test.ts`) moram nessa suíte, e é ela que trava coisas
# como "essa ação precisa exigir admin". Publicar sem passar por ali seria publicar às
# cegas.
#
# **O que continua manual, e não dá para automatizar aqui:** aplicar migration no banco.
# Ver `supabase/APLICADAS.md`. Deploy de função e migration são passos diferentes, e é
# justamente a ordem entre eles que exige uma pessoa decidindo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # para republicar a função sem precisar de commit novo
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # a ordem é a mais barata primeiro: teste quebra em 3s, build leva mais
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  funcoes:
    # sem os testes verdes não publica
    needs: testes
    # PR não publica: só o que entrou no `main` vira produção
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # o ref do projeto não é segredo: quem protege o dado é a RLS, não o nome do
      # projeto. Troque pelo ref do SEU projeto (Project Settings -> General).
      PROJETO: xqqxzdmswwoklkdkmmqk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # falha explicando, em vez de deixar o CLI dar erro de credencial que não diz nada
      - name: Confere o token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN. Crie um token em https://supabase.com/dashboard/account/tokens e cadastre em Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # sem nome de função = publica TODAS as de supabase/functions. É o que mantém o
      # repositório como fonte da verdade: função que ninguém tocou é republicada igual,
      # e nenhuma fica para trás por esquecimento.
      - name: Publica as Edge Functions
        run: supabase functions deploy --project-ref "$PROJETO"
